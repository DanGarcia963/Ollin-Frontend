name: Verificar Ollin Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-check:
    name: Validar pantallas y JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar pruebas estáticas
        run: node scripts/check-frontend.mjs
